[package]
name = "recorder"
version = "0.1.0"
edition = "2021"
description = "GUI-independent recorder: default mic + WASAPI loopback -> 16 kHz mono 16-bit WAV"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.18"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
